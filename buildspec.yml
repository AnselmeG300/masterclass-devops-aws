version: 0.2

# CodeBuild lit ce fichier a la racine du depot.
# Ici le "build" est volontairement simple : on injecte le numero de build
# dans la page, puis on publie le dossier dist/ comme artefact.
# C'est cet artefact que l'etape Deploy enverra vers S3.

phases:
  build:
    commands:
      - echo "=== Build de l'application statique ==="
      - mkdir -p dist
      - export BUILD_TAG="v${CODEBUILD_BUILD_NUMBER} du $(date -u '+%d/%m/%Y a %H:%M UTC')"
      - echo "Version generee : ${BUILD_TAG}"
      - sed "s|__BUILD_VERSION__|${BUILD_TAG}|g" app/index.html > dist/index.html
      - cp app/styles.css dist/styles.css
      - echo "=== Build termine ==="

artifacts:
  base-directory: dist
  files:
    - '**/*'
